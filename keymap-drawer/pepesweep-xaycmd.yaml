  - Q
  - {t: L, h: Ctl+C}
  - {t: G, h: Ctl+X}
  - {t: D, h: Ctl+V}
  - {t: H, h: Ctl+Z}
  - {t: U, h: Ctl+S}
  - {t: O, h: Ctl+Y}
  - ;
  - {t: I, h: LGUI}
  - {t: R, h: LALT}
  - {t: S, h: LSHIFT}
  - {t: T, h: LCTL}
  - {t: N, h: RCTL}
  - {t: E, h: RSHIFT}
  - {t: A, h: RALT}
  - {t: C, h: RGUI}
  - {t: TAB, h: nav}
  - {t: SPC, h: alpha2}
  - {t: BSPC, h: num}
  - {t: DEL, h: fun}
  alpha2:
  - ''''
  - V
  - W
  - M
  - F
  - ','
  - Z
  - /
  - \
  - J
  - {t: P, h: LSHIFT}
  - K
  - B
  - {t: ., h: LSHIFT}
  - X
  - Y
  - {t: ▽, type: trans}
  - {type: held}
  - {t: ▽, type: trans}
  - {t: ▽, type: trans}
  num:
  - '`'
  - '1'
  - '2'
  - '3'
  - '7'
  - '8'
  - '9'
  - '0'
  - ''
  - '4'
  - {t: '5', h: LSHIFT}
  - '6'
  - '='
  - {t: '[', h: LSHIFT}
  - ']'
  - '-'
  - {t: ▽, type: trans}
  - {t: ▽, type: trans}
  - {type: held}
  - {t: ▽, type: trans}
  nav:
  - ''
  - ''
  - PG UP
  - ''
  - ''
  - UP
  - ''
  - ''
  - ''
  - {t: HOME, h: LALT}
  - {t: PG DN, h: LSHIFT}
  - {t: END, h: LCTL}
  - {t: LEFT, h: RCTL}
  - {t: DOWN, h: RSHIFT}
  - {t: RIGHT, h: RALT}
