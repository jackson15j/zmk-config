  - F1
  - F2
  - F3
  - F7
  - F8
  - F9
  - ''
  - ''
  - F4
  - F5
  - F6
  - F10
  - F11
  - F12
  - ''
  - ''
  - ''
  - ''
  - {type: held}
combos:
- p: [16, 17]
  k: ESC
- p: [18, 19]
  k: ENTER
